# Python Development Stack
# Tools for Python development including interpreter, package managers, and IDE support

packages:
  # Python interpreter
  - name: Python.Python.3.14
    install: true
    version: latest
    pkgmgr: winget
    description: "Python 3.14"

  # VS Code extensions for Python
  - name: ms-python.python
    install: true
    version: latest
    pkgmgr: vscode
    description: "Python language support for VS Code"

  - name: ms-python.vscode-pylance
    install: true
    version: latest
    pkgmgr: vscode
    description: "Pylance - Python language server"

  - name: ms-python.debugpy
    install: true
    version: latest
    pkgmgr: vscode
    description: "Python debugger"

  # Jupyter support
  - name: ms-toolsai.jupyter
    install: true
    version: latest
    pkgmgr: vscode
    description: "Jupyter notebook support"

  # PyCharm Community Edition (alternative IDE)
  - name: JetBrains.PyCharm.Community
    install: false
    version: latest
    pkgmgr: winget
    description: "PyCharm Community Edition IDE"

  # Linting and formatting
  - name: charliermarsh.ruff
    install: true
    version: latest
    pkgmgr: vscode
    description: "Ruff - fast Python linter and formatter (replaces black/flake8)"

  # Static type checking
  - name: ms-python.mypy-type-checker
    install: true
    version: latest
    pkgmgr: vscode
    description: "Mypy type checker for Python"
